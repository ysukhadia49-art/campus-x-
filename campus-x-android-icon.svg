<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <!-- Android App Icon Container (Squircle) -->
  <rect width="192" height="192" rx="42" fill="#243447"/>
  
  <!-- Subtle inner gradient glow -->
  <radialGradient id="iconGlow" cx="50%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#314A63" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#243447" stop-opacity="0"/>
  </radialGradient>
  <rect width="192" height="192" rx="42" fill="url(#iconGlow)"/>

  <!-- Centered Collegiate Emblem -->
  <g transform="translate(36, 36) scale(1)">
    <!-- Mortarboard Diamond / Campus Apex -->
    <polygon points="60,14 102,34 60,54 18,34" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="60,26 90,40 60,54 30,40" fill="#BAC7D5" opacity="0.95"/>
    <path d="M26,38 L24,58 M22,58 L26,58 L25,68 L23,68 Z" fill="#BAC7D5" stroke="#BAC7D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35,58 L54,77 L30,104 L44,104 L60,85 L76,104 L90,104 L66,77 L85,58 L71,58 L60,70 L49,58 Z" fill="#FFFFFF"/>
    <circle cx="60" cy="40" r="3.5" fill="#243447"/>
    <circle cx="30" cy="104" r="3.5" fill="#BAC7D5"/>
    <circle cx="90" cy="104" r="3.5" fill="#BAC7D5"/>
  </g>
</svg>
